name: llms.txt v2 Validator
description: Check llms.txt format, links, Markdown discovery and scoped indexes
author: Polygons Media LLC
branding:
  icon: check-circle
  color: green
inputs:
  url:
    description: Website URL or llms.txt URL
    required: true
  fail-on:
    description: Fail on error or warn
    default: error
  max-links:
    description: Maximum linked resources to check
    default: "50"
  timeout:
    description: Request timeout in milliseconds
    default: "10000"
runs:
  using: node24
  main: dist/action.cjs
