name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+JSON.parse(require('fs').readFileSync('package.json')).version) process.exit(1)"
      - run: npm publish --access public --provenance
