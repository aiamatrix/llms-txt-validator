name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm pack --dry-run
      - name: Verify minimum Node.js runtime
        if: matrix.node == 22
        run: |
          node dist/cli.js tests/fixtures/good/basic.txt --json
          node --input-type=module -e "import { validate, exitCode } from './dist/index.js'; process.exitCode = exitCode(await validate('tests/fixtures/good/basic.txt'));"
